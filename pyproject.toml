[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
  \.git
| \.hg
| \.mypy_cache
| \.tox
| \.venv
| _build
| buck-out
| build
| dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "B"]
ignore = ["E501"]
per-file-ignores = { "test_*.py" = ["D"] }

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["."]
python_files = ["test_*.py"]
